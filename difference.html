<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계차수열 — Sequence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f7f7f5;color:#111;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
nav{width:min(1180px,85%);height:86px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.name{font-size:14px}.nav-right{display:flex;gap:30px}
nav a{color:#111;text-decoration:none;font-size:13px;position:relative}
nav a:after{content:"";position:absolute;left:0;bottom:-7px;width:0;height:1px;background:#111;transition:.3s}
nav a:hover:after{width:100%}
.page{width:min(1180px,85%);margin:auto;padding:75px 0 120px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:#777;margin-bottom:25px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
h1{font-size:clamp(70px,10vw,145px);line-height:.82;letter-spacing:-.075em;font-weight:800}
.number{font-family:Georgia,serif;font-size:110px;line-height:.8;color:#ddd}
.intro{max-width:680px;margin-top:42px;font-size:16px;line-height:1.9;color:#555}
.formula{margin-top:42px;border-top:1px solid #111;border-bottom:1px solid #111;padding:25px 0;font:28px Georgia,serif}
.formula small{font:11px Arial,sans-serif;color:#777;margin-left:20px}
.menu{margin-top:75px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #111;border-left:1px solid #111}
.menu a{min-height:145px;padding:22px;border-right:1px solid #111;border-bottom:1px solid #111;text-decoration:none;color:#111;transition:.3s;display:flex;flex-direction:column;justify-content:space-between}
.menu a:hover{background:#111;color:#fff}.menu .num{font-size:11px;letter-spacing:.1em}.menu .label{font-size:18px}.menu .eng{font-size:10px;letter-spacing:.15em,.5}
.content{margin-top:100px}.section{display:grid;grid-template-columns:180px 1fr;gap:50px;padding:55px 0;border-top:1px solid #ccc}.section:last-child{border-bottom:1px solid #ccc}
.section-num{font:34px Georgia,serif;color:#aaa}.section h2{font-size:30px;letter-spacing:-.04em;margin-bottom:22px}.section p{font-size:15px;line-height:2;color:#555;max-width:720px}
.example{margin-top:25px;padding:25px;background:#111;color:#fff;font:22px Georgia,serif;letter-spacing:.04em}.example span{color:#aaa;margin:0 8px}.ratio{margin-top:14px;font-size:11px;letter-spacing:.12em;color:#888}
.back{display:inline-block;margin-top:65px;color:#111;text-decoration:none;font-size:12px;letter-spacing:.12em}
@media(max-width:800px){.nav-right{gap:13px}.page{padding-top:55px}.title-row{display:block}.number{font-size:70px;margin-top:25px}.menu{grid-template-columns:1fr 1fr}.section{grid-template-columns:1fr;gap:15px}}
</style>
</head>
<body>
