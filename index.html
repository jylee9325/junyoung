<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이준영 — Sequence</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f7f7f5;
    color: #111;
    min-height: 100vh;
    overflow-x: hidden;
}


/* 배경 격자 */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(0,0,0,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.035) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}


/* =========================
   상단 메뉴
========================= */

nav {

    width: min(1180px, 85%);
    height: 86px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 5;
}


.name {

    font-size: 14px;
    letter-spacing: .04em;

}


.nav-right {

    display: flex;
    gap: 30px;

}


nav a {

    color: #111;

    text-decoration: none;

    font-size: 13px;

    position: relative;

}


/* 마우스를 올리면 밑줄 */

nav a::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -7px;

    width: 0;
    height: 1px;

    background: #111;

    transition: .3s;

}


nav a:hover::after {

    width: 100%;

}


/* =========================
   메인
========================= */

.hero {

    width: min(1180px, 85%);

    min-height: calc(100vh - 86px);

    margin: auto;

    position: relative;

    display: flex;
    align-items: center;

    padding: 30px 0 100px;

}


.hero-copy {

    position: relative;

    z-index: 2;

    max-width: 820px;

}


/* 작은 영문 */

.eyebrow {

    font-size: 12px;

    letter-spacing: .22em;

    color: #666;

    margin-bottom: 26px;

}


/* SEQUENCE */

h1 {

    font-size: clamp(
        75px,
        11.5vw,
        165px
    );

    line-height: .82;

    letter-spacing: -.075em;

    font-weight: 800;

}


.outline {

    color: transparent;

    -webkit-text-stroke: 1.5px #111;

}


/* 설명 */

.desc {

    margin-top: 42px;

    font-size: 15px;

    line-height: 1.9;

    color: #555;

}


/* 수열 */

.sequence-line {

    margin-top: 35px;

    display: flex;

    align-items: center;

    gap: 13px;

    font-family: Georgia, serif;

    font-size: 19px;

}


.sequence-line span {

    display: inline-block;

    transition: .25s;

}


.sequence-line span:hover {

    transform: translateY(-5px);

}


.arrow {

    color: #999;

    font-family: Arial;

    font-size: 14px;

}


/* =========================
   오른쪽 원형 그래픽
========================= */

.orbit {

    position: absolute;

    width: 470px;
    height: 470px;

    right: -10px;

    top: 50%;

    transform: translateY(-50%);

    border: 1px solid rgba(0,0,0,.13);

    border-radius: 50%;

}


.orbit::before,
.orbit::after {

    content: "";

    position: absolute;

    inset: 50px;

    border: 1px solid rgba(0,0,0,.09);

    border-radius: 50%;

}


.orbit::after {

    inset: 115px;

}


/* 움직이는 점 */

.dot {

    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #111;

    animation:
        orbit 8s linear infinite;

    transform-origin:
        235px 235px;

    left: 229px;
    top: 229px;

}


@keyframes orbit {

    to {
        transform: rotate(360deg);
    }

}


/* 수학 기호 */

.math-mark {

    position: absolute;

    font-family: Georgia, serif;

    color: rgba(0,0,0,.22);

    font-size: 24px;

}


.m1 {
    right: 130px;
    top: 28px;
}

.m2 {
    right: 35px;
    bottom: 125px;
}

.m3 {
    left: 80px;
    bottom: 35px;
}

.m4 {
    left: 20px;
    top: 150px;
}


/* =========================
   아래 카드
========================= */

.cards {

    position: absolute;

    right: 0;
    bottom: 55px;

    display: flex;

    gap: 8px;

}


.card {

    border: 1px solid #111;

    background:
        rgba(247,247,245,.8);

    backdrop-filter: blur(8px);

    padding: 11px 15px;

    font-size: 11px;

    letter-spacing: .04em;

    transition: .3s;

    text-decoration: none;

    color: #111;

}


.card:hover {

    background: #111;

    color: white;

    transform: translateY(-4px);

}


/* =========================
   SCROLL
========================= */

.scroll {

    position: absolute;

    bottom: 34px;
    left: 0;

    font-size: 10px;

    letter-spacing: .18em;

    color: #888;

}


.scroll::before {

    content: "";

    display: inline-block;

    width: 35px;
    height: 1px;

    background: #aaa;

    vertical-align: middle;

    margin-right: 10px;

}


/* =========================
   모바일
========================= */

@media (max-width: 800px) {

    .nav-right {
        gap: 14px;
    }

    .hero {
        align-items: flex-start;
        padding-top: 100px;
    }

    h1 {
        font-size: 19vw;
    }

    .orbit {

        width: 320px;
        height: 320px;

        right: -80px;

        top: 62%;
    }

    .dot {

        transform-origin:
            160px 160px;

        left: 154px;
        top: 154px;
    }

    .cards {
        display: none;
    }

}

</style>
</head>


<body>


<!-- =========================
     상단
========================= -->

<nav>

    <div class="name">
        이준영
    </div>


    <div class="nav-right">

        <a href="arithmetic.html">
            등차수열
        </a>

        <a href="#">
            등비수열
        </a>

        <a href="#">
            조화수열
        </a>

        <a href="#">
            계차수열
        </a>

    </div>

</nav>



<!-- =========================
     메인
========================= -->

<main class="hero">


    <div class="hero-copy">


        <div class="eyebrow">
            A PERSONAL MATHEMATICAL ARCHIVE
        </div>


        <h1>

            SEQUENCE<span class="outline">.</span>

        </h1>


        <p class="desc">

            숫자의 나열에서 규칙을 발견하고,<br>
            그 규칙을 수학으로 설명한다.

        </p>


        <div class="sequence-line">

            <span>1</span>

            <span class="arrow">→</span>

            <span>2</span>

            <span class="arrow">→</span>

            <span>4</span>

            <span class="arrow">→</span>

            <span>8</span>

            <span class="arrow">→</span>

            <span>16</span>

            <span class="arrow">→</span>

            <span>?</span>

        </div>


    </div>



    <!-- 오른쪽 그래픽 -->

    <div class="orbit">

        <div class="dot"></div>

        <span class="math-mark m1">
            aₙ
        </span>

        <span class="math-mark m2">
            Σ
        </span>

        <span class="math-mark m3">
            n → ∞
        </span>

        <span class="math-mark m4">
            Δ
        </span>

    </div>



    <!-- 하단 카드 -->

    <div class="cards">

        <a
            class="card"
            href="arithmetic.html"
        >
            01 ARITHMETIC
        </a>

        <a
            class="card"
            href="#"
        >
            02 GEOMETRIC
        </a>

        <a
            class="card"
            href="#"
        >
            03 HARMONIC
        </a>

        <a
            class="card"
            href="#"
        >
            04 DIFFERENCE
        </a>

    </div>



    <div class="scroll">
        SCROLL TO EXPLORE
    </div>


</main>


</body>
</html>
