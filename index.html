<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이준영 — Sequence</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f7f7f5;
    color: #111;
    min-height: 100vh;
    overflow-x: hidden;
}


/* 배경 격자 */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(0,0,0,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,0,0,.035) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}


/* =========================
   상단 메뉴
========================= */

nav {

    width: min(1180px, 85%);
    height: 86px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 5;
}


.name {

    font-size: 14px;
    letter-spacing: .04em;
    color: #111;
    text-decoration: none;
    font-weight: 600;
    position: relative;

}

/* 이준영 이름 밑줄 효과 */
.name::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -7px;
    width: 0;
    height: 1px;
    background: #111;
    transition: .3s;
}

.name:hover::after {
    width: 100%;
}


.nav-right {

    display: flex;
    gap: 30px;

}


nav a, nav button.nav-btn {

    color: #111;

    text-decoration: none;

    font-size: 13px;

    position: relative;
    
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;

}


/* 마우스를 올리면 밑줄 */

nav a::after, nav button.nav-btn::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -7px;

    width: 0;
    height: 1px;

    background: #111;

    transition: .3s;

}


nav a:hover::after, nav button.nav-btn:hover::after {

    width: 100%;

}


/* =========================
   메인
========================= */

.hero {

    width: min(1180px, 85%);

    min-height: calc(100vh - 86px);

    margin: auto;

    position: relative;

    display: flex;
    align-items: center;

    padding: 30px 0 100px;

}


.hero-copy {

    position: relative;

    z-index: 2;

    max-width: 820px;

}


/* 작은 영문 */

.eyebrow {

    font-size: 12px;

    letter-spacing: .22em;

    color: #666;

    margin-bottom: 26px;

}


/* SEQUENCE */

h1 {

    font-size: clamp(
        75px,
        11.5vw,
        165px
    );

    line-height: .82;

    letter-spacing: -.075em;

    font-weight: 800;

}


.outline {

    color: transparent;

    -webkit-text-stroke: 1.5px #111;

}


/* 설명 */

.desc {

    margin-top: 42px;

    font-size: 15px;

    line-height: 1.9;

    color: #555;

}


/* 수열 */

.sequence-line {

    margin-top: 35px;

    display: flex;

    align-items: center;

    gap: 13px;

    font-family: Georgia, serif;

    font-size: 19px;

}


.sequence-line span {

    display: inline-block;

    transition: .25s;

}


.sequence-line span:hover {

    transform: translateY(-5px);

}


.arrow {

    color: #999;

    font-family: Arial;

    font-size: 14px;

}


/* =========================
   오른쪽 원형 그래픽
========================= */

.orbit {

    position: absolute;

    width: 470px;
    height: 470px;

    right: -10px;

    top: 50%;

    transform: translateY(-50%);

    border: 1px solid rgba(0,0,0,.13);

    border-radius: 50%;

}


.orbit::before,
.orbit::after {

    content: "";

    position: absolute;

    inset: 50px;

    border: 1px solid rgba(0,0,0,.09);

    border-radius: 50%;

}


.orbit::after {

    inset: 115px;

}


/* 움직이는 점 */

.dot {

    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #111;

    animation:
        orbit 8s linear infinite;

    transform-origin:
        235px 235px;

    left: 229px;
    top: 229px;

}


@keyframes orbit {

    to {
        transform: rotate(360deg);
    }

}


/* 수학 기호 */

.math-mark {

    position: absolute;

    font-family: Georgia, serif;

    color: rgba(0,0,0,.22);

    font-size: 24px;

}


.m1 {
    right: 130px;
    top: 28px;
}

.m2 {
    right: 35px;
    bottom: 125px;
}

.m3 {
    left: 80px;
    bottom: 35px;
}

.m4 {
    left: 20px;
    top: 150px;
}


/* =========================
   아래 카드
========================= */

.cards {

    position: absolute;

    right: 0;
    bottom: 55px;

    display: flex;

    gap: 8px;

}


.card {

    border: 1px solid #111;

    background:
        rgba(247,247,245,.8);

    backdrop-filter: blur(8px);

    padding: 11px 15px;

    font-size: 11px;

    letter-spacing: .04em;

    transition: .3s;

    text-decoration: none;

    color: #111;

}


.card:hover {

    background: #111;

    color: white;

    transform: translateY(-4px);

}


/* =========================
   SCROLL
========================= */

.scroll {

    position: absolute;

    bottom: 34px;
    left: 0;

    font-size: 10px;

    letter-spacing: .18em;

    color: #888;

}


.scroll::before {

    content: "";

    display: inline-block;

    width: 35px;
    height: 1px;

    background: #aaa;

    vertical-align: middle;

    margin-right: 10px;

}


/* =========================
   모달 (수열 분석기 팝업 창)
========================= */

.modal-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.4);

    backdrop-filter: blur(4px);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition: opacity .3s ease;

}


.modal-overlay.active {

    opacity: 1;

    pointer-events: auto;

}


.analyzer-card {

    background: #fff;

    border: 1px solid #111;

    padding: 32px;

    width: min(520px, 90%);

    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);

    position: relative;

}


.close-btn {

    position: absolute;

    top: 20px;

    right: 20px;

    background: none;

    border: none;

    font-size: 20px;

    cursor: pointer;

    color: #888;

}


.close-btn:hover {

    color: #111;

}


.analyzer-card h2 {

    font-size: 14px;

    letter-spacing: .18em;

    margin-bottom: 22px;

    color: #111;

}


.input-group {

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-bottom: 18px;

}


.input-group input {

    padding: 12px 14px;

    border: 1px solid #ccc;

    background: #fdfdfd;

    font-size: 13px;

    outline: none;

    transition: border-color .2s;

}


.input-group input:focus {

    border-color: #111;

}


.btn-analyze {

    padding: 12px;

    background: #111;

    color: #fff;

    border: none;

    font-size: 12px;

    letter-spacing: .1em;

    cursor: pointer;

    transition: background .2s;

}


.btn-analyze:hover {

    background: #333;

}


.result-box {

    margin-top: 20px;

    padding-top: 18px;

    border-top: 1px dashed #ccc;

    font-size: 13px;

    line-height: 1.8;

    color: #222;

    display: none;

}


.result-tag {

    display: inline-block;

    padding: 2px 8px;

    background: #111;

    color: #fff;

    font-size: 11px;

    margin-bottom: 8px;

}


/* =========================
   모바일
========================= */

@media (max-width: 800px) {

    .nav-right {
        gap: 14px;
    }

    .hero {
        align-items: flex-start;
        padding-top: 100px;
    }

    h1 {
        font-size: 19vw;
    }

    .orbit {

        width: 320px;
        height: 320px;

        right: -80px;

        top: 62%;
    }

    .dot {

        transform-origin:
            160px 160px;

        left: 154px;
        top: 154px;
    }

    .cards {
        display: none;
    }

}

</style>
</head>


<body>


<!-- =========================
     상단
========================= -->

<nav>

    <a class="name" href="Profile.html">
        이준영
    </a>


    <div class="nav-right">

        <!-- 등차수열 왼쪽에 수열 분석기 버튼 배치 -->
        <button class="nav-btn" onclick="openAnalyzer()">
            수열 분석기
        </button>

        <a href="arithmetic.html">
            등차수열
        </a>

        <a href="geometric.html">
            등비수열
        </a>

        <a href="harmonic.html">
            조화수열
        </a>

        <a href="difference.html">
            계차수열
        </a>

    </div>

</nav>



<!-- =========================
     메인
========================= -->

<main class="hero">


    <div class="hero-copy">


        <div class="eyebrow">
            A PERSONAL MATHEMATICAL ARCHIVE
        </div>


        <h1>

            SEQUENCE<span class="outline">.</span>

        </h1>


        <p class="desc">

            숫자의 나열에서 규칙을 발견하고,<br>
            그 규칙을 수학으로 설명한다.

        </p>


        <div class="sequence-line">

            <span>1</span>

            <span class="arrow">→</span>

            <span>2</span>

            <span class="arrow">→</span>

            <span>4</span>

            <span class="arrow">→</span>

            <span>8</span>

            <span class="arrow">→</span>

            <span>16</span>

            <span class="arrow">→</span>

            <span>?</span>

        </div>


    </div>



    <!-- 오른쪽 그래픽 -->

    <div class="orbit">

        <div class="dot"></div>

        <span class="math-mark m1">
            aₙ
        </span>

        <span class="math-mark m2">
            Σ
        </span>

        <span class="math-mark m3">
            n → ∞
        </span>

        <span class="math-mark m4">
            Δ
        </span>

    </div>



    <!-- 하단 카드 -->

    <div class="cards">

        <a
            class="card"
            href="arithmetic.html"
        >
            01 ARITHMETIC
        </a>

        <a
            class="card"
            href="geometric.html"
        >
            02 GEOMETRIC
        </a>

        <a
            class="card"
            href="harmonic.html"
        >
            03 HARMONIC
        </a>

        <a
            class="card"
            href="difference.html"
        >
            04 DIFFERENCE
        </a>

    </div>



    <div class="scroll">
        SCROLL TO EXPLORE
    </div>


</main>



<!-- =========================
     수열 분석기 모달 팝업
========================= -->

<div id="analyzerModal" class="modal-overlay" onclick="closeAnalyzerOnBg(event)">
    <div class="analyzer-card">
        <button class="close-btn" onclick="closeAnalyzer()">&times;</button>
        <h2>🧮 SEQUENCE ANALYZER</h2>
        
        <div class="input-group">
            <input type="text" id="sequenceInput" placeholder="수열 데이터 (예: 1 2 4 8 16)">
            <input type="number" id="targetNInput" placeholder="구하고 싶은 n번째 항" value="10" min="1">
        </div>

        <button class="btn-analyze" style="width: 100%;" onclick="runAnalyzer()">분석 및 예측하기</button>

        <div id="resultBox" class="result-box">
            <span id="resultType" class="result-tag">등비수열</span><br>
            📌 <strong>최적 일반항:</strong> <span id="resultFormula">a_n = ...</span><br>
            📏 <strong>평균 오차:</strong> ±<span id="resultError">0.0000</span><br>
            🎯 <strong><span id="targetNLabel">10</span>번째 항 예측값:</strong> <span id="resultValue" style="font-weight: bold; color: #000;">0</span>
        </div>
    </div>
</div>



<!-- =========================
     스크립트 (파이썬 변환 알고리즘)
========================= -->

<script>
function openAnalyzer() {
    document.getElementById("analyzerModal").classList.add("active");
}

function closeAnalyzer() {
    document.getElementById("analyzerModal").classList.remove("active");
}

function closeAnalyzerOnBg(event) {
    if (event.target.id === "analyzerModal") {
        closeAnalyzer();
    }
}

function runAnalyzer() {
    const inputStr = document.getElementById("sequenceInput").value.trim();
    const targetN = parseInt(document.getElementById("targetNInput").value);

    if (!inputStr) {
        alert("수열 데이터를 입력해주세요.");
        return;
    }

    const data = inputStr.split(/\s+/).map(Number).filter(n => !isNaN(n));
    const n = data.length;

    if (n < 3) {
        alert("❌ 최소 3개 이상의 데이터가 필요합니다.");
        return;
    }

    if (isNaN(targetN) || targetN <= 0) {
        alert("⚠️ 항 번호 n은 1 이상의 자연수여야 합니다.");
        return;
    }

    let candidates = [];

    // 1. 등차수열
    const a1_arith = data[0];
    let sum_d = 0, count_d = 0;
    for (let i = 1; i < n; i++) {
        sum_d += (data[i] - data[0]);
        count_d += i;
    }
    const d_avg = sum_d / count_d;
    const pred_arith = data.map((_, i) => a1_arith + i * d_avg);
    const err_arith = pred_arith.reduce((acc, p, i) => acc + Math.pow(data[i] - p, 2), 0) / n;

    candidates.push({
        type: '등차수열',
        error: err_arith,
        formula: `a_n = ${a1_arith.toFixed(3)} + (n - 1) * ${d_avg.toFixed(3)}`,
        calc: (target) => a1_arith + (target - 1) * d_avg
    });

    // 2. 등비수열
    if (!data.includes(0)) {
        let r_list = [];
        for (let i = 0; i < n - 1; i++) {
            r_list.push(data[i + 1] / data[i]);
        }
        const r_avg = r_list.reduce((a, b) => a + b, 0) / r_list.length;
        const a1_geom = data[0];
        const pred_geom = data.map((_, i) => a1_geom * Math.pow(r_avg, i));
        const err_geom = pred_geom.reduce((acc, p, i) => acc + Math.pow(data[i] - p, 2), 0) / n;

        candidates.push({
            type: '등비수열',
            error: err_geom,
            formula: `a_n = ${a1_geom.toFixed(3)} * (${r_avg.toFixed(3)}^(n - 1))`,
            calc: (target) => a1_geom * Math.pow(r_avg, target - 1)
        });
    }

    // 3. 조화수열
    if (!data.includes(0)) {
        const recips = data.map(x => 1 / x);
        const a1_recip = recips[0];
        let sum_recip_d = 0, count_recip_d = 0;
        for (let i = 1; i < n; i++) {
            sum_recip_d += (recips[i] - recips[0]);
            count_recip_d += i;
        }
        const d_recip_avg = sum_recip_d / count_recip_d;
        const pred_harm = recips.map((_, i) => 1 / (a1_recip + i * d_recip_avg));
        const err_harm = pred_harm.reduce((acc, p, i) => acc + Math.pow(data[i] - p, 2), 0) / n;

        candidates.push({
            type: '조화수열',
            error: err_harm,
            formula: `a_n = 1 / (${a1_recip.toFixed(4)} + (n - 1) * ${d_recip_avg.toFixed(4)})`,
            calc: (target) => 1 / (a1_recip + (target - 1) * d_recip_avg)
        });
    }

    // 4. 계차수열
    let diffs = [];
    for (let i = 0; i < n - 1; i++) diffs.push(data[i + 1] - data[i]);
    const b1 = diffs[0];

    let second_diffs = [];
    for (let i = 0; i < diffs.length - 1; i++) second_diffs.push(diffs[i + 1] - diffs[i]);
    const c_avg = second_diffs.length > 0 ? second_diffs.reduce((a, b) => a + b, 0) / second_diffs.length : 0;
    const a1_diff = data[0];

    const pred_diff = data.map((_, i) => a1_diff + i * b1 + (i * (i - 1) / 2) * c_avg);
    const err_diff = pred_diff.reduce((acc, p, i) => acc + Math.pow(data[i] - p, 2), 0) / n;

    candidates.push({
        type: '계차수열',
        error: err_diff,
        formula: `a_n = ${a1_diff.toFixed(3)} + (n-1)*${b1.toFixed(3)} + (n-1)(n-2)/2 * ${c_avg.toFixed(3)}`,
        calc: (target) => a1_diff + (target - 1) * b1 + ((target - 1) * (target - 2) / 2) * c_avg
    });

    candidates.sort((a, b) => a.error - b.error);
    const bestModel = candidates[0];
    const predictedVal = bestModel.calc(targetN);

    document.getElementById("resultType").innerText = bestModel.type;
    document.getElementById("resultFormula").innerText = bestModel.formula;
    document.getElementById("resultError").innerText = Math.sqrt(bestModel.error).toFixed(4);
    document.getElementById("targetNLabel").innerText = targetN;
    document.getElementById("resultValue").innerText = predictedVal.toLocaleString('ko-KR', { maximumFractionDigits: 4 });

    document.getElementById("resultBox").style.display = "block";
}
</script>


</body>
</html>
