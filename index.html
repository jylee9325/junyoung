<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQUENCE — 수열 탐구</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f7f7f5;
    color: #111;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경의 은은한 수학 격자 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
      linear-gradient(
        rgba(0,0,0,.035) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(0,0,0,.035) 1px,
        transparent 1px
      );

    background-size: 42px 42px;

    mask-image:
      linear-gradient(
        to bottom,
        black,
        transparent 85%
      );
  }


  /* =========================
     NAVIGATION
  ========================= */

  nav {
    width: min(1180px, 90%);
    margin: 0 auto;

    height: 86px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 5;
  }

  .brand {
    font-size: 14px;
    letter-spacing: .08em;
    font-weight: 700;
  }

  .nav-center {
    font-size: 14px;
    letter-spacing: .04em;
  }

  .nav-right {
    display: flex;
    gap: 28px;
  }

  nav a {
    color: #111;
    text-decoration: none;
    font-size: 13px;

    position: relative;
  }

  /* 마우스를 올렸을 때 밑줄 */
  nav a::after {
    content: "";

    position: absolute;
    left: 0;
    bottom: -6px;

    width: 0;
    height: 1px;

    background: #111;

    transition: width .3s;
  }

  nav a:hover::after {
    width: 100%;
  }


  /* =========================
     MAIN HERO
  ========================= */

  .hero {
    width: min(1180px, 90%);
    min-height: calc(100vh - 86px);

    margin: 0 auto;

    position: relative;

    display: flex;
    align-items: center;

    padding: 30px 0 100px;
  }

  .hero-copy {
    position: relative;
    z-index: 2;

    max-width: 760px;
  }


  /* 작은 제목 */

  .eyebrow {
    font-size: 12px;

    letter-spacing: .22em;

    margin-bottom: 25px;

    color: #666;
  }


  /* SEQUENCE */

  h1 {
    font-size: clamp(72px, 12vw, 170px);

    line-height: .82;

    letter-spacing: -.075em;

    font-weight: 800;
  }


  /* 테두리 글자 */

  .outline {
    color: transparent;

    -webkit-text-stroke: 1.5px #111;
  }


  /* 설명 */

  .desc {
    margin-top: 42px;

    font-size: 16px;

    line-height: 1.8;

    color: #555;

    max-width: 460px;
  }


  /* =========================
     수열 예시
  ========================= */

  .sequence-line {
    margin-top: 34px;

    display: flex;

    align-items: center;

    gap: 13px;

    font-family: Georgia, serif;

    font-size: 19px;

    white-space: nowrap;
  }

  .sequence-line span {
    display: inline-block;

    transition: transform .25s;
  }

  /* 숫자에 마우스를 올리면 살짝 올라감 */

  .sequence-line span:hover {
    transform: translateY(-5px);
  }

  .arrow {
    font-family: Arial, sans-serif;

    color: #999;

    font-size: 14px;
  }


  /* =========================
     오른쪽 원형 그래픽
  ========================= */

  .orbit {
    position: absolute;

    width: 470px;
    height: 470px;

    right: -20px;
    top: 50%;

    transform: translateY(-50%);

    border: 1px solid rgba(0,0,0,.13);

    border-radius: 50%;
  }


  /* 내부 원 */

  .orbit::before,
  .orbit::after {
    content: "";

    position: absolute;

    inset: 50px;

    border: 1px solid rgba(0,0,0,.09);

    border-radius: 50%;
  }

  .orbit::after {
    inset: 115px;
  }


  /* 움직이는 점 */

  .dot {
    position: absolute;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #111;

    animation: orbit 8s linear infinite;

    transform-origin: 235px 235px;

    left: 229px;
    top: 229px;
  }


  /* 점이 원을 따라 회전 */

  @keyframes orbit {

    to {
      transform: rotate(360deg);
    }

  }


  /* =========================
     수학 기호
  ========================= */

  .math-mark {
    position: absolute;

    font-family: Georgia, serif;

    color: rgba(0,0,0,.22);

    font-size: 24px;
  }

  .m1 {
    right: 130px;
    top: 28px;
  }

  .m2 {
    right: 35px;
    bottom: 125px;
  }

  .m3 {
    left: 80px;
    bottom: 35px;
  }

  .m4 {
    left: 20px;
    top: 150px;
  }


  /* =========================
     수열 종류 카드
  ========================= */

  .cards {
    position: absolute;

    right: 0;
    bottom: 55px;

    display: flex;

    gap: 8px;
  }

  .card {
    border: 1px solid #111;

    background: rgba(247,247,245,.8);

    backdrop-filter: blur(8px);

    padding: 11px 15px;

    font-size: 11px;

    letter-spacing: .04em;

    transition: .3s;
  }


  /* 카드 hover */

  .card:hover {
    background: #111;

    color: #fff;

    transform: translateY(-4px);
  }


  /* =========================
     SCROLL 표시
  ========================= */

  .scroll {
    position: absolute;

    bottom: 34px;
    left: 0;

    font-size: 10px;

    letter-spacing: .18em;

    color: #888;
  }


  .scroll::before {
    content: "";

    display: inline-block;

    width: 35px;
    height: 1px;

    background: #aaa;

    vertical-align: middle;

    margin-right: 10px;
  }


  /* =========================
     모바일
  ========================= */

  @media (max-width: 800px) {

    .nav-center {
      display: none;
    }

    .nav-right {
      gap: 15px;
    }

    .hero {
      align-items: flex-start;

      padding-top: 100px;
    }

    h1 {
      font-size: 19vw;
    }

    .orbit {
      width: 320px;
      height: 320px;

      right: -80px;
      top: 62%;
    }

    .dot {
      transform-origin: 160px 160px;

      left: 154px;
      top: 154px;
    }

    .cards {
      display: none;
    }

  }

</style>
</head>


<body>


<!-- =========================
     상단 메뉴
========================= -->

<nav>

  <a class="brand" href="#">
    math
  </a>

  <div class="nav-center">
    내 로그
  </div>

  <div class="nav-right">

    <a href="#sequence">
      sequence
    </a>

    <a href="#arithmetic">
      등차수열
    </a>

    <a href="#geometric">
      등비수열
    </a>

    <a href="#harmonic">
      조화수열
    </a>

    <a href="#difference">
      계차수열
    </a>

  </div>

</nav>



<!-- =========================
     메인 화면
========================= -->

<main class="hero" id="sequence">


  <div class="hero-copy">


    <!-- 작은 영문 문구 -->

    <div class="eyebrow">
      A PERSONAL MATHEMATICAL ARCHIVE
    </div>


    <!-- 메인 타이틀 -->

    <h1>

      SEQUENCE<span class="outline">.</span>

    </h1>


    <!-- 설명 -->

    <p class="desc">

      숫자의 나열에서 규칙을 발견하고,<br>

      그 규칙을 수학으로 설명한다.

    </p>


    <!-- 수열 예시 -->

    <div
      class="sequence-line"
      aria-label="sequence example"
    >

      <span>1</span>

      <span class="arrow">→</span>

      <span>2</span>

      <span class="arrow">→</span>

      <span>4</span>

      <span class="arrow">→</span>

      <span>8</span>

      <span class="arrow">→</span>

      <span>16</span>

      <span class="arrow">→</span>

      <span>?</span>

    </div>


  </div>



  <!-- =========================
       오른쪽 원
  ========================= -->

  <div class="orbit">

    <div class="dot"></div>


    <!-- 수학 기호 -->

    <span class="math-mark m1">
      aₙ
    </span>

    <span class="math-mark m2">
      Σ
    </span>

    <span class="math-mark m3">
      n → ∞
    </span>

    <span class="math-mark m4">
      Δ
    </span>

  </div>



  <!-- =========================
       수열 종류
  ========================= -->

  <div class="cards">

    <div class="card">
      01 ARITHMETIC
    </div>

    <div class="card">
      02 GEOMETRIC
    </div>

    <div class="card">
      03 HARMONIC
    </div>

    <div class="card">
      04 DIFFERENCE
    </div>

  </div>



  <!-- =========================
       아래 SCROLL
  ========================= -->

  <div class="scroll">

    SCROLL TO EXPLORE

  </div>


</main>



<!-- =========================
     이후 페이지 연결용
========================= -->

<section id="arithmetic"></section>

<section id="geometric"></section>

<section id="harmonic"></section>

<section id="difference"></section>


</body>
</html>
